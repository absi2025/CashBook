name: Build CashBook EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore CashBook.csproj

      - name: Build
        run: dotnet build CashBook.csproj -c Release --no-restore

      - name: Publish single-file EXE
        run: >
          dotnet publish CashBook.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o ./publish

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: CashBook-Windows
          path: ./publish/CashBook.exe
          if-no-files-found: error
